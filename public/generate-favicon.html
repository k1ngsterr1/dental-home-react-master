<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generate Favicon</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        background: #f0f0f0;
      }
      canvas {
        border: 2px solid #333;
        margin: 20px;
        background: white;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background: #00a3e0;
        color: white;
        border: none;
        border-radius: 5px;
      }
      button:hover {
        background: #0088c2;
      }
      .preview {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Favicon Generator - Tooth Icon</h1>
    <div class="preview">
      <div>
        <h3>16x16</h3>
        <canvas id="canvas16" width="16" height="16"></canvas>
      </div>
      <div>
        <h3>32x32</h3>
        <canvas id="canvas32" width="32" height="32"></canvas>
      </div>
      <div>
        <h3>64x64</h3>
        <canvas id="canvas64" width="64" height="64"></canvas>
      </div>
    </div>
    <button onclick="downloadFavicon()">Download as favicon.ico (32x32)</button>
    <button onclick="downloadPNG()">Download as PNG (32x32)</button>

    <script>
      function drawTooth(canvas) {
        const ctx = canvas.getContext("2d");
        const size = canvas.width;
        const scale = size / 32;

        // Clear canvas
        ctx.clearRect(0, 0, size, size);

        // Background
        ctx.fillStyle = "#00A3E0";
        ctx.fillRect(0, 0, size, size);

        // Draw tooth
        ctx.save();
        ctx.scale(scale, scale);

        // Tooth shape
        ctx.beginPath();
        ctx.moveTo(16, 4);
        ctx.bezierCurveTo(12, 4, 10, 6.5, 10, 10);
        ctx.lineTo(10, 11);
        ctx.bezierCurveTo(9.5, 13, 9, 15, 9, 17);
        ctx.bezierCurveTo(8.5, 18.5, 8, 19.5, 8, 21);
        ctx.bezierCurveTo(8, 23.5, 8.5, 25.5, 10, 27);
        ctx.bezierCurveTo(11, 27.7, 12.5, 28, 14, 28);
        ctx.bezierCurveTo(15, 28, 15.3, 27.8, 15.7, 27);
        ctx.lineTo(16, 26);
        ctx.lineTo(16.3, 27);
        ctx.bezierCurveTo(16.7, 27.8, 17, 28, 18, 28);
        ctx.bezierCurveTo(19.5, 28, 21, 27.7, 22, 27);
        ctx.bezierCurveTo(23.5, 25.5, 24, 23.5, 24, 21);
        ctx.bezierCurveTo(24, 19.5, 23.5, 18.5, 23, 17);
        ctx.bezierCurveTo(23, 15, 22.5, 13, 22, 11);
        ctx.lineTo(22, 10);
        ctx.bezierCurveTo(22, 6.5, 20, 4, 16, 4);
        ctx.closePath();

        ctx.fillStyle = "white";
        ctx.fill();

        // Tooth outline
        ctx.strokeStyle = "rgba(0, 163, 224, 0.3)";
        ctx.lineWidth = 0.5;
        ctx.stroke();

        // Highlight
        ctx.beginPath();
        ctx.ellipse(14, 11, 1.5, 2.5, 0, 0, 2 * Math.PI);
        ctx.fillStyle = "rgba(230, 247, 255, 0.7)";
        ctx.fill();

        ctx.restore();
      }

      // Draw on all canvases
      drawTooth(document.getElementById("canvas16"));
      drawTooth(document.getElementById("canvas32"));
      drawTooth(document.getElementById("canvas64"));

      function downloadFavicon() {
        const canvas = document.getElementById("canvas32");
        const link = document.createElement("a");
        link.download = "favicon.ico";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      function downloadPNG() {
        const canvas = document.getElementById("canvas32");
        const link = document.createElement("a");
        link.download = "favicon.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }
    </script>
  </body>
</html>
